<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root {
    --ivory: #0d0d0e;
    --paper: #131314;
    --ink: #e9e5db;
    --muted: #8b867b;
    --line: #2a2926;
    --gold: #c4a265;
    --gold-soft: #1c1913;
    --bad: #d9786b;
    --user: #25231f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ivory); color: var(--ink);
    font: 15px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  button { font: inherit; cursor: pointer; }

  .app { width: 100%; max-width: 720px; height: 100%; display: flex; flex-direction: column; background: var(--paper); border-inline: 1px solid var(--line); }

  header { padding: 16px 28px; display: flex; justify-content: flex-end; }
  .link { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; border-bottom: 1px solid transparent; }
  .link:hover { color: var(--ink); border-bottom-color: var(--gold); }

  .messages { flex: 1; overflow-y: auto; padding: 28px; display: flex; flex-direction: column; gap: 22px; }
  .msg { max-width: 82%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); border: 1px solid var(--line); padding: 10px 16px; border-radius: 2px; }
  .msg.bot { align-self: flex-start; padding-left: 16px; border-left: 1px solid var(--gold); }
  .msg.error { color: var(--bad); border-left-color: var(--bad); }
  .msg strong { font-weight: 600; }

  .typing { align-self: flex-start; padding-left: 16px; border-left: 1px solid var(--gold); color: var(--gold); letter-spacing: .3em; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .approval { align-self: flex-start; width: min(100%, 420px); border: 1px solid var(--gold); background: var(--gold-soft); padding: 16px 18px; }
  .approval h4 { margin: 0 0 10px; font: 400 16px/1.2 Georgia, serif; letter-spacing: .03em; }
  .approval dl { margin: 0 0 14px; display: grid; grid-template-columns: auto 1fr; gap: 3px 16px; font-size: 14px; }
  .approval dt { color: var(--muted); }
  .approval dd { margin: 0; }
  .approval .actions { display: flex; gap: 10px; }
  .approval button { flex: 1; padding: 9px; border: 1px solid var(--muted); background: transparent; color: var(--ink); letter-spacing: .1em; text-transform: uppercase; font-size: 12px; }
  .approval .yes { background: var(--gold); border-color: var(--gold); color: #131314; }
  .approval button:hover { opacity: .85; }
  .approval.done { border-color: var(--line); background: transparent; }
  .approval.done h4 { color: var(--muted); }
  .approval .note { margin: 0 0 14px; font-size: 14px; overflow-wrap: anywhere; }
  .approval .field { display: block; margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .approval input, .approval textarea {
    display: block; width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 0;
    background: var(--ivory); color: var(--ink); font: 14px/1.5 inherit; outline: none; resize: vertical;
    max-height: none; overflow-y: auto;
  }
  .approval input:focus, .approval textarea:focus { border-color: var(--gold); }
  .approval button:disabled { opacity: .35; cursor: default; }

  form { display: flex; align-items: flex-end; gap: 16px; padding: 14px 28px 22px; border-top: 1px solid var(--line); }
  textarea {
    flex: 1; resize: none; max-height: 120px; border: 0; border-bottom: 1px solid var(--line); background: transparent;
    padding: 8px 0; font: inherit; color: var(--ink); outline: none; overflow-y: hidden;
  }
  textarea:focus { border-bottom-color: var(--gold); }
  textarea:disabled { opacity: .5; }
  textarea::placeholder { color: var(--muted); }
  .send { background: none; border: 0; padding: 8px 0; color: var(--gold); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; border-bottom: 1px solid var(--gold); }
  .send:disabled { color: var(--line); border-bottom-color: var(--line); cursor: default; }

  @media (max-width: 520px) {
    header, form { padding-inline: 18px; }
    .messages { padding: 20px 18px; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="link" id="new" type="button">Mới</button>
  </header>
  <div class="messages" id="messages" role="log" aria-live="polite"></div>
  <form id="composer">
    <textarea id="input" rows="1" maxlength="1000" placeholder="Nhập tin nhắn" aria-label="Tin nhắn"></textarea>
    <button class="send" id="send" type="submit">Gửi</button>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
const messagesEl = $("messages"), inputEl = $("input"), sendEl = $("send");

const WELCOME = "Xin chào, tôi có thể giúp bạn tra cứu đơn hàng, huỷ đơn hoặc hoàn tiền. Vui lòng cho tôi mã đơn hàng, ví dụ ORD-1001.";
const TOOL_LABEL = { cancel_order: "Huỷ đơn", issue_refund: "Hoàn tiền", return_order: "Hoàn hàng" };

// pending: đang chờ nhân viên duyệt; offering: dialog mời hoàn hàng đang mở, khách chưa chọn.
let sessionId = null, busy = false, pending = false, offering = false;

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function fmt(text) { return esc(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/^[*-] /gm, "• "); }
function add(cls, html) {
  const d = document.createElement("div");
  d.className = cls;
  d.innerHTML = html;
  messagesEl.appendChild(d);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return d;
}
function refresh() {
  inputEl.disabled = sendEl.disabled = busy || pending || offering;
  inputEl.placeholder = pending ? "Đang chờ nhân viên duyệt" : offering ? "Hãy trả lời câu hỏi phía trên" : "Nhập tin nhắn";
  if (!inputEl.disabled) inputEl.focus();
}

async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) { const e = new Error((data && data.detail) || `Lỗi ${res.status}`); e.status = res.status; throw e; }
  return data;
}

function approvalCard(a) {
  const args = a.args || {};
  const isReturn = a.tool === "return_order";
  const rows = [["Hành động", TOOL_LABEL[a.tool] || a.tool]];
  if (args.order_id) rows.push(["Mã đơn", args.order_id]);
  if (args.amount !== undefined) rows.push([isReturn ? "Số tiền hoàn" : "Số tiền", args.amount]);
  if (isReturn) rows.push(["Video", args.video], ["Lý do của khách", args.reason]);
  else rows.push(["Lý do", a.reason]);
  const card = add("approval", `<h4>Cần nhân viên duyệt</h4>
    <dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <div class="actions"><button class="yes" type="button">Duyệt</button><button type="button">Từ chối</button></div>`);
  const actions = card.querySelector(".actions");
  const [yes, no] = actions.querySelectorAll("button");
  yes.onclick = () => decide(card, true);
  no.onclick = () => rejectForm(card, actions);
}

// Bấm Từ chối: hiện ô nhập lý do (bắt buộc), chỉ gọi API khi bấm "Gửi từ chối".
function rejectForm(card, actions) {
  const box = document.createElement("div");
  box.className = "reject-box";
  box.innerHTML = `<label class="field">Lý do từ chối (sẽ gửi lại cho khách)
      <textarea rows="3" maxlength="500" placeholder="Nhập lý do"></textarea></label>
    <div class="actions"><button class="yes" type="button" disabled>Gửi từ chối</button><button type="button">Quay lại</button></div>`;
  actions.style.display = "none";
  card.appendChild(box);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  const text = box.querySelector("textarea");
  const [submit, back] = box.querySelectorAll("button");
  text.oninput = () => { submit.disabled = !text.value.trim(); };
  text.focus();
  submit.onclick = () => decide(card, false, text.value.trim());
  back.onclick = () => { box.remove(); actions.style.display = ""; };
}

// Huỷ đơn bị chặn vì đã giao: hỏi khách có muốn làm yêu cầu hoàn hàng không.
function offerCard(orderId) {
  offering = true; refresh();
  const card = add("approval", `<h4>Yêu cầu hoàn hàng</h4>
    <p class="note">Bạn có muốn làm yêu cầu hoàn hàng cho đơn ${esc(orderId)} không?</p>
    <div class="actions"><button class="yes" type="button">Có</button><button type="button">Không</button></div>`);
  const [yes, no] = card.querySelectorAll("button");
  yes.onclick = () => returnForm(card, orderId);
  no.onclick = () => closeOffer(card, "Đã bỏ qua yêu cầu hoàn hàng");
}

function closeOffer(card, title) {
  card.classList.add("done");
  card.querySelector("h4").textContent = title;
  card.querySelectorAll(".note, .actions, .field").forEach((e) => e.remove());
  offering = false; refresh();
}

// Khách nhập video hiện trạng (mô phỏng, chỉ là chữ) và lý do hoàn, rồi gửi cho nhân viên.
function returnForm(card, orderId) {
  card.querySelector(".note").textContent = `Nhập thông tin để nhân viên xem xét hoàn hàng đơn ${orderId}.`;
  card.querySelector(".actions").remove();
  card.insertAdjacentHTML("beforeend", `
    <label class="field">Video hiện trạng sản phẩm (mô phỏng, không upload)
      <input type="text" maxlength="200" placeholder="Ví dụ: san-pham-loi.mp4"></label>
    <label class="field">Lý do hoàn hàng
      <textarea rows="3" maxlength="500" placeholder="Nhập lý do"></textarea></label>
    <div class="actions"><button class="yes" type="button" disabled>Gửi</button><button type="button">Huỷ</button></div>`);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  const video = card.querySelector("input"), reason = card.querySelector("textarea");
  const [submit, cancel] = card.querySelectorAll(".actions button");
  const check = () => { submit.disabled = !(video.value.trim() && reason.value.trim()); };
  video.oninput = check;
  reason.oninput = check;
  video.focus();
  cancel.onclick = () => closeOffer(card, "Đã huỷ yêu cầu hoàn hàng");
  submit.onclick = () => {
    const body = { order_id: orderId, video: video.value.trim(), reason: reason.value.trim() };
    closeOffer(card, "Đã gửi yêu cầu hoàn hàng");
    turn(() => api(`/api/sessions/${sessionId}/return-requests`, body));
  };
}

function render(r) {
  if (r.status === "pending_approval") {
    pending = true;
    approvalCard(r.approval);
  } else {
    add("msg bot", fmt(r.reply || ""));
    if (r.offer_return) offerCard(r.offer_return);
  }
}

async function turn(request) {
  busy = true; refresh();
  const typing = add("typing", "···");
  try {
    render(await request());
  } catch (e) {
    if (e.status === 404) {
      try { await newSession(); add("msg bot error", "Phiên cũ đã hết hạn, đã mở cuộc trò chuyện mới. Vui lòng gửi lại tin nhắn."); }
      catch (_) { add("msg bot error", "Không kết nối được máy chủ."); }
    } else {
      add("msg bot error", esc(e.message));
    }
  } finally {
    typing.remove();
    busy = false; refresh();
  }
}

function send() {
  const text = inputEl.value.trim();
  if (!text || busy || pending || offering || !sessionId) return;
  add("msg user", esc(text));
  inputEl.value = "";
  grow();
  turn(() => api(`/api/sessions/${sessionId}/messages`, { message: text }));
}

function decide(card, approved, reason) {
  card.classList.add("done");
  card.querySelector("h4").textContent = approved ? "Đã duyệt" : "Đã từ chối";
  card.querySelectorAll(".actions, .reject-box").forEach((e) => e.remove());
  if (!approved) card.insertAdjacentHTML("beforeend", `<p class="note">Lý do: ${esc(reason)}</p>`);
  pending = false;
  turn(() => api(`/api/sessions/${sessionId}/approval`, approved ? { approved } : { approved, reason }));
}

async function newSession() { sessionId = (await api("/api/sessions")).session_id; }

async function start() {
  messagesEl.innerHTML = "";
  pending = false; offering = false;
  add("msg bot", esc(WELCOME));
  busy = true; refresh();
  try { await newSession(); } catch (e) { add("msg bot error", "Không kết nối được máy chủ: " + esc(e.message)); }
  busy = false; refresh();
}

function grow() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  inputEl.style.overflowY = inputEl.scrollHeight > 120 ? "auto" : "hidden";
}
inputEl.addEventListener("input", grow);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("composer").addEventListener("submit", (e) => { e.preventDefault(); send(); });
$("new").onclick = () => { if (!busy) start(); };

start();
</script>
</body>
</html>
